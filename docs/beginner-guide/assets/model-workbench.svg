<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">模型怎样从磁盘到处理器</title>
  <desc id="desc">模型文件放在磁盘仓库；运行时部分数据进入内存工作台；CPU或GPU处理后产生回答。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#4c7091"/></marker>
  </defs>
  <rect width="1200" height="500" rx="28" fill="#f1f7fc"/>
  <text x="60" y="68" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#183650">大模型像一本要边取边读的厚书</text>
  <text x="60" y="112" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#536579">文件可放在仓库；正在处理的部分要放上工作台</text>
  <rect x="60" y="175" width="270" height="230" rx="22" fill="#e0effb" stroke="#94b8d6" stroke-width="3"/>
  <path d="M115 240h160v120H115z" fill="#fff" stroke="#4c7091" stroke-width="4"/>
  <path d="M145 230v-24a20 20 0 0 1 40 0v24M205 230v-24a20 20 0 0 1 40 0v24" fill="none" stroke="#4c7091" stroke-width="9"/>
  <text x="195" y="295" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#183650">模型文件</text>
  <text x="195" y="335" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#536579">硬盘仓库</text>
  <line x1="350" y1="290" x2="440" y2="290" stroke="#4c7091" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="470" y="175" width="280" height="230" rx="22" fill="#e8f5ee" stroke="#8abda0" stroke-width="3"/>
  <path d="M525 340h170l-18 20H543z" fill="#81af91"/>
  <rect x="555" y="235" width="60" height="80" rx="8" fill="#fff" stroke="#399065" stroke-width="4"/>
  <rect x="625" y="215" width="60" height="100" rx="8" fill="#d4eee0" stroke="#399065" stroke-width="4"/>
  <path d="M565 255h40M565 280h32M635 242h40M635 267h32M635 292h36" stroke="#399065" stroke-width="6" stroke-linecap="round"/>
  <text x="610" y="385" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#183650">内存工作台</text>
  <line x1="770" y1="290" x2="860" y2="290" stroke="#4c7091" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="890" y="175" width="250" height="230" rx="22" fill="#fff0d7" stroke="#e0b967" stroke-width="3"/>
  <circle cx="1015" cy="260" r="54" fill="#fff" stroke="#bd8320" stroke-width="5"/>
  <path d="M980 262h70M1015 227v70M990 237l50 50M1040 237l-50 50" stroke="#bd8320" stroke-width="6" stroke-linecap="round"/>
  <text x="1015" y="350" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#183650">CPU / 显卡</text>
  <text x="1015" y="382" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#536579">处理并生成回答</text>
  <text x="600" y="460" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#536579">内存不足时，反复从硬盘取数据会拖慢速度；“能启动”不等于“很快”</text>
</svg>
